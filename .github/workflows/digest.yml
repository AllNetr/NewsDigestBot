name: News Digest

# Расписание задаётся в UTC! Казахстан (Алматы/Астана) — это UTC+5.
# Поэтому 08:00 и 20:00 по времени Казахстана соответствуют 03:00 и 15:00 UTC.
# Если живёте в другом часовом поясе — пересчитайте под себя:
# https://crontab.guru поможет проверить синтаксис.
on:
  schedule:
    - cron: "0 3 * * *"    # 08:00 по времени Казахстана (UTC+5)
    - cron: "0 15 * * *"   # 20:00 по времени Казахстана (UTC+5)
  workflow_dispatch: {}     # позволяет запускать вручную кнопкой "Run workflow" на GitHub

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news digest
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_digest.py
